<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="theme-color" content="#ffffff">
<meta name="description" content="First aid guides, emergency contacts and SOS alerts.">

<title>FirstAid</title>
<style>
:root{--navy:#8f0d1c;--navy2:#e11d2e;--green:#e11d2e;--red:#e11d2e;--ink:#2a0d12;--bg:#fff4f4;--card:#fff;--mut:#8a5a60;--line:#f6dcdc;--sh:0 6px 22px rgba(143,13,28,.12)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;max-width:560px;margin:0 auto}
header{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;padding:calc(12px + env(safe-area-inset-top,0px)) 14px 14px;display:flex;align-items:center;gap:8px;border-radius:0 0 22px 22px;box-shadow:0 8px 24px rgba(143,13,28,.3);z-index:2}
header h1{font-size:20px;font-weight:700;flex:1;letter-spacing:.2px}
header button{background:rgba(255,255,255,.14);border:0;color:#fff;font-size:20px;width:40px;height:40px;border-radius:50%}
header button[hidden]{display:none}
main{flex:1;overflow-y:auto;padding:16px 16px 8px}
nav{display:flex;align-items:flex-end;background:var(--card);margin:6px 12px calc(10px + env(safe-area-inset-bottom,0px));border-radius:24px;box-shadow:var(--sh);padding:6px 4px}
nav button{flex:1;background:none;border:0;padding:6px 0;font-size:11.5px;color:var(--mut);border-radius:16px}
nav button b{display:block;font-size:20px;font-weight:400;line-height:1.3}
nav button.on{color:var(--navy2);font-weight:700}
nav button.sosn b{width:54px;height:54px;margin:-26px auto 2px;border-radius:50%;background:var(--red);display:grid;place-items:center;font-size:22px;box-shadow:0 6px 16px rgba(225,29,46,.5);border:4px solid var(--card)}
nav button.sosn{color:var(--red);font-weight:700}
.ban{display:flex;align-items:center;justify-content:space-between;gap:8px;border-radius:22px;padding:14px 18px;margin-bottom:14px;color:#fff;background:linear-gradient(135deg,#8f0d1c,#e11d2e);box-shadow:var(--sh)}
.ban b{font-size:18px;line-height:1.25;max-width:55%}
.ban svg{flex:none;width:128px;height:96px}
.hero{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.cross{flex:none;display:grid;place-items:center;width:58px;height:58px;border-radius:18px;background:#fff;color:var(--red);font-size:40px;font-weight:900;line-height:1;box-shadow:var(--sh)}
.hero h2{font-size:26px;line-height:1.1}.hero p{color:var(--mut);font-size:14px}
.alert{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:0;border-radius:20px;padding:16px;margin-bottom:14px;color:#fff;background:linear-gradient(135deg,#7f0f1e,#3b0610);box-shadow:0 10px 24px rgba(59,6,16,.35);font-size:17px;font-weight:700}
.alert small{display:block;font-weight:400;opacity:.92;font-size:13px}
.alert i{flex:none;width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.22);display:grid;place-items:center;font-style:normal;font-size:22px;font-weight:800}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gt{display:flex;flex-direction:column;align-items:flex-start;gap:10px;text-align:left;background:var(--card);border:0;border-radius:20px;padding:14px;box-shadow:var(--sh);color:var(--ink);font-size:15.5px;font-weight:650;line-height:1.25}
.gt.wide{grid-column:1/-1;flex-direction:row;align-items:center}
.gt small{display:block;color:var(--mut);font-weight:400;font-size:12.5px;margin-top:2px}
.gt i,.tile i{flex:none;width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-style:normal;font-size:22px;background:var(--c,#2563c9)}
.tile{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card);border:0;border-radius:18px;padding:12px 14px;box-shadow:var(--sh);color:var(--ink);font-size:16px;font-weight:650;margin-bottom:10px}
.tile small{display:block;color:var(--mut);font-weight:400;font-size:13px}
.tile::after{content:'›';margin-left:auto;color:var(--mut);font-size:26px}
.gt:active,.tile:active,.alert:active{transform:scale(.98)}
.sosbtn{display:block;margin:20px auto 8px;width:160px;height:160px;border-radius:50%;border:10px solid rgba(225,29,46,.18);background:radial-gradient(circle at 35% 30%,#ff5566,var(--red) 60%,#a30d1c);color:#fff;font-size:40px;font-weight:800;animation:pulse 2.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(225,29,46,.45)}70%,100%{box-shadow:0 0 0 26px rgba(225,29,46,0)}}
@media(prefers-reduced-motion:reduce){.sosbtn{animation:none}}
.card{background:var(--card);border-radius:20px;padding:16px;margin-bottom:12px;box-shadow:var(--sh)}
.card h3{font-size:17px;margin-bottom:6px}
.row{display:flex;align-items:center;gap:10px}.row>div{flex:1;min-width:0}
.btn{border:0;border-radius:14px;padding:12px 16px;font-size:15px;font-weight:650;background:var(--green);color:#fff}
.btn.red{background:var(--red)}.btn.ghost{background:var(--line);color:var(--ink)}
.btn.block{display:block;width:100%}
input{width:100%;padding:13px;border:1.5px solid var(--line);border-radius:14px;background:var(--bg);color:var(--ink);font-size:16px;margin-bottom:8px}
input:focus{outline:2px solid var(--navy2);border-color:transparent}
.gh{display:flex;align-items:center;gap:14px;margin-bottom:12px}
.gh i{width:62px;height:62px;border-radius:20px;display:grid;place-items:center;font-style:normal;font-size:32px;background:var(--card);box-shadow:var(--sh)}
.step{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.step:last-child{border:0}
.step span{flex:none;width:30px;height:30px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px}
.warn{background:#fff4d6;color:#6a4b00;border-radius:14px;padding:12px;font-size:14px;margin:12px 0}
.mut{color:var(--mut);font-size:14px}
.dang{background:#fff1f2;border:2px solid #e11d2e;color:#8f0d1c;border-radius:16px;padding:12px;margin-bottom:12px}
.prev{width:100%;max-height:280px;object-fit:contain;border-radius:14px;background:#111;display:block}
.opt{display:block;width:100%;text-align:left;margin-bottom:10px;padding:14px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);font-size:16px}
.opt.ok{border-color:var(--green);background:#dff5e8;color:#0d4a27}.opt.bad{border-color:var(--red);background:#fde3e3;color:#7a1414}
.bar{height:8px;background:var(--line);border-radius:4px;margin:6px 0 16px}.bar i{display:block;height:100%;background:var(--green);border-radius:4px}
#ov{position:fixed;inset:0;background:linear-gradient(160deg,#f0364a,#a30d1c);color:#fff;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;z-index:9}
#ov.show{display:flex}
#ov.res{justify-content:flex-start;overflow-y:auto;padding:24px 16px}
#ov .sc{background:rgba(255,255,255,.15);border-radius:18px;padding:12px;margin:12px 0;width:100%;max-width:440px;text-align:left}
#ov .sc h3{margin:0 0 6px;font-size:16px}
#ov .sc small{display:block;opacity:.85}
#ov .sc .btn{width:100%}
#ov .sc .row .btn{width:auto}
#ov .big{font-size:96px;font-weight:800;line-height:1}
#ov .btn{background:#fff;color:var(--red);margin-top:10px;min-width:200px}
a{color:inherit}
@media(min-width:800px){
body{max-width:none}
header{padding-left:max(24px,calc((100% - 1000px)/2));padding-right:max(24px,calc((100% - 1000px)/2))}
main{padding:24px max(24px,calc((100% - 1000px)/2)) 12px}
.grid{grid-template-columns:repeat(3,1fr)}
.gt.wide{grid-column:auto;flex-direction:column;align-items:flex-start}
.ban svg{width:170px;height:128px}.ban b{font-size:22px}
nav{width:640px;max-width:100%;margin:6px auto 14px}
#ov{padding:48px}
}
/* red and white blend */
:root{color-scheme:light;--bg:#ffffff;--ink:#3b0a12;--line:#f1d3d7}
.card,.gt,.tile,.opt,nav{border:1px solid var(--line)}
:root{--bg:#fdf4f5;--line:#f3dcdf;--mut:#7d6469;--ink:#2b1a1d;--sh:0 4px 18px rgba(143,13,28,.08);--head:#c81428}
header{background:var(--card);color:var(--head);box-shadow:0 4px 18px rgba(143,13,28,.1);border-bottom:3px solid #e11d2e}
header h1{color:var(--head)}
header button{background:#ffe3e6;color:#c81428}
.ban{background:linear-gradient(135deg,#fff,#ffe6e9);color:var(--head);border:1px solid var(--line)}
.cross{background:#e11d2e;color:#fff}
.hero h2{color:var(--head)}
.alert{background:linear-gradient(135deg,#ef3347,#c8102e);box-shadow:0 10px 24px rgba(225,29,46,.3)}
.gt i,.tile i{background:#ffe3e6}
nav button.on{color:var(--head)}
:root{--bg:#ffffff;--ink:#3b0a12;--line:#f1d3d7}
.pill{padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700;background:#ffe3e6;color:#c81428}.pill.Responding{background:#fff1d6;color:#8a5a00}.pill.Resolved{background:#dff5e8;color:#0d4a27}
nav:empty{display:none}
#back{width:auto;border-radius:20px;padding:0 14px;font-size:15px;font-weight:600}
</style>
</head>

<script>
const $=s=>document.querySelector(s);
const store={get(k,d){try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---- Firebase (paste your keys from Firebase console > Project settings > Your apps > Web app) ---- */
const FB={apiKey:'AIzaSyCVURoAHXiYB-dek6CQmdGbILCs38IH89g',authDomain:'first-aid-862d5.firebaseapp.com',projectId:'first-aid-862d5',appId:'1:531791459802:web:81be35a988ba6de91ebce3'};
let fbAuth=null,fbDb=null;
if(FB.apiKey&&typeof firebase!=='undefined'){try{firebase.initializeApp(FB);fbAuth=firebase.auth();fbDb=firebase.firestore()}catch(e){}}
const useFB=!!fbDb;
const ADMIN_HASH='1d460e02'; // admin password is stored as a hash, not as plain text
const hashPw=s=>{let x=0x811c9dc5;for(const c of s){x^=c.charCodeAt(0);x=Math.imul(x,0x01000193)>>>0}return x.toString(16)};
const DB={
  async saveAlert(a){
    if(useFB){try{await fbDb.collection('Emergencies').add({...a,userId:fbAuth.currentUser?fbAuth.currentUser.uid:null,status:'New',time:firebase.firestore.FieldValue.serverTimestamp()});return}catch(e){}}
    const t=Date.now(),l=store.get('allAlerts',[]);l.unshift({...a,id:'L'+t,time:t,status:'New'});store.set('allAlerts',l.slice(0,100));
  },
  watch(cb){
    if(useFB){return fbDb.collection('Emergencies').orderBy('time','desc').limit(100).onSnapshot(
      s=>cb(s.docs.map(d=>{const x=d.data();return{...x,id:d.id,time:x.time&&x.time.toMillis?x.time.toMillis():Date.now()}}),''),
      e=>cb(null,e.message))}
    const f=()=>cb(store.get('allAlerts',[]),'');f();const id=setInterval(f,4000);return()=>clearInterval(id);
  },
  saveNums(l){if(useFB)fbDb.collection('Settings').doc('numbers').set({list:l.map(x=>({name:x[0],phone:x[1]}))}).catch(()=>{})},
  async setStatus(id,st){
    if(useFB){await fbDb.collection('Emergencies').doc(id).update({status:st});return}
    const l=store.get('allAlerts',[]),x=l.find(a=>a.id===id);if(x)x.status=st;store.set('allAlerts',l);
  }
};
const GUIDES=[
{t:'Choking',i:'😮',s:['Encourage the person to cough.','Give up to 5 back blows between the shoulder blades.','Give up to 5 abdominal thrusts (stand behind, fist above the navel, pull inward and upward).','Alternate back blows and thrusts. Call 112 if it does not clear.','If the person becomes unresponsive, start CPR and keep calling for help.']},
{t:'Severe bleeding',i:'🩸',s:['Press firmly on the wound with a clean cloth or gloved hand.','Keep pressing. Do not remove soaked cloth; add more on top.','Raise the injured limb if you do not suspect a broken bone.','Bandage firmly once bleeding slows.','Call 112 for heavy bleeding or if it does not stop in 10 minutes.']},
{t:'Burns',i:'🔥',s:['Cool the burn under cool running water for 20 minutes.','Remove rings, watches and tight clothing near the burn before it swells.','Cover loosely with clean cling film or a clean non-fluffy cloth.','Do not burst blisters. Do not apply butter, oil or toothpaste.','Get medical help for large burns, or burns on the face, hands or genitals.']},
{t:'Nosebleed',i:'👃',s:['Sit upright and lean forward slightly.','Pinch the soft part of the nose for 10 minutes without letting go.','Breathe through the mouth. Do not tilt the head back.','Apply a cold cloth to the bridge of the nose.','Seek help if bleeding lasts over 20 minutes or follows a head injury.']},
{t:'Fainting',i:'😵',s:['Lay the person flat and raise their legs about 30 cm.','Loosen tight clothing and give fresh air.','Check that they are breathing.','When they wake, let them sit up slowly and sip water.','Call 112 if they do not recover within 1 minute or are not breathing.']},
{t:'Sprain or broken bone',i:'🦴',s:['Keep the injured part still. Do not try to straighten it.','Support it with padding or a sling.','Apply a cold pack wrapped in cloth for 15 minutes.','Do not let the person eat or drink if a broken bone is suspected.','Get medical help.']},
{t:'Seizure',i:'⚡',s:['Clear hard objects away and cushion the head.','Do not hold the person down or put anything in their mouth.','Note the time the seizure started.','When shaking stops, turn them on their side (recovery position).','Call 112 if it lasts over 5 minutes, repeats, or the person is injured or does not wake up.']},
{t:'Snake bite',i:'🐍',s:['Keep the person calm and still.','Remove rings and tight items near the bite.','Keep the bitten limb still and below heart level.','Do not cut, suck, or tie a tight band around the bite.','Take the person to a hospital quickly or call 112.']},
{t:'CPR (not breathing)',i:'🫀',s:['Check the scene is safe, tap the person and shout for help.','Call 112 or ask someone to, and send for an AED if there is one.','Lay them on a firm surface. Place the heel of your hand on the centre of the chest.','Push hard and fast, about 5 to 6 cm deep, 100 to 120 times a minute.','If trained, give 2 rescue breaths after every 30 pushes. Keep going until help arrives.']},
{t:'Cuts and scrapes',i:'🩹',s:['Wash your hands, then rinse the wound with clean water.','Press with a clean cloth to stop any bleeding.','Cover with a clean dressing and change it daily.','Watch for redness, swelling, pus or fever. See a clinic if you notice these.']},
{t:'Insect sting',i:'🐝',s:['Scrape the sting out sideways. Do not squeeze it.','Wash with soap and water.','Apply a cold pack for 10 minutes.','Call 112 if the face or throat swells, or breathing becomes hard.']},
{t:'Poisoning',i:'☠️',s:['Move the person away from the poison.','Do not make them vomit.','Keep the container or label to show the doctor.','Call 112 or go to a hospital at once.','If unconscious but breathing, place them on their side.']},
{t:'Heat exhaustion',i:'☀️',s:['Move to a shaded, cool place.','Loosen clothing and cool with wet cloths.','Give small sips of water.','Call 112 if they are confused, have hot dry skin, or become unconscious.']},
{t:'Asthma attack',i:'😮‍💨',s:['Sit the person upright and keep them calm.','Help them use their reliever inhaler: 1 puff, 4 breaths, repeat up to 10 puffs.','Loosen tight clothing.','Call 112 if there is no improvement in 10 minutes or they cannot speak.']},
{t:'Eye injury',i:'👁️',s:['Do not rub the eye.','For chemicals or dust, rinse with clean water for 15 minutes.','Do not remove anything stuck in the eye.','Cover loosely with a clean pad and get medical help.']},
{t:'Electric shock',i:'🔌',s:['Do not touch the person until the power is off.','Switch off at the main switch or use a dry wooden object to separate them.','Call 112 and check breathing. Start CPR if needed.','Cool any burns with running water.']},
{t:'Drowning',i:'🌊',s:['Do not jump in. Reach with a pole or throw a rope or float.','Call 112.','Once out, check breathing. Start CPR if not breathing.','Keep them warm and on their side if breathing.']},
{t:'Head injury',i:'🤕',s:['Keep the person still and apply a cold pack.','Watch for vomiting, drowsiness, confusion or a severe headache.','Call 112 if any of these appear.','No sport or play until a doctor says it is safe.']},
{t:'Diarrhoea and dehydration',i:'💧',s:['Give small, frequent sips of ORS or clean water.','Home ORS: 6 level teaspoons sugar and half a teaspoon salt in 1 litre of clean water.','Keep feeding normally.','Go to a clinic if there is blood, high fever, or they cannot drink.']},
{t:'Allergic reaction',i:'🤧',s:['Move away from the trigger.','For mild itching or rash, use an antihistamine as advised.','If the face or throat swells or breathing is hard, call 112 now.','Lay them flat and use an adrenaline pen if one is available.']},
{t:'Dog bite',i:'🐕',s:['Wash the wound with soap and running water for 10 minutes.','Cover with a clean dressing.','Go to a clinic the same day for rabies and tetanus protection.','Note the dog and where it lives.']},
{t:'Fever',i:'🌡️',s:['Rest, drink plenty of fluids and wear light clothing.','Give paracetamol as the label directs.','Sponge with lukewarm water if very hot.','Get tested for malaria if in a risk area. See a doctor if fever lasts over 2 days or comes with fits, stiff neck or rash.']},
{t:'Scorpion sting',i:'🦂',s:['Keep the person calm and still.','Wash the sting with soap and clean water.','Apply a cold pack wrapped in cloth for 10 minutes.','Do not cut the sting, suck it or tie anything tight around the limb.','Go to a clinic or hospital, especially for a child, or if numbness, drooling, twitching or trouble breathing appear.']},
{t:'Venom in the eye',i:'🐍',s:['Do not rub the eye.','Rinse the eye straight away with plenty of clean water for at least 15 minutes. Tilt the head so the water runs away from the other eye.','Keep the eye open while rinsing, as far as the person can.','Cover loosely with a clean cloth.','Go to a hospital urgently, even if the pain eases.']},
{t:'Tooth knocked out',i:'🦷',s:['Find the tooth and hold it by the crown (the white part), not the root.','If it is dirty, rinse it briefly with milk or clean water. Do not scrub it.','For an adult tooth, keep it in a cup of milk. Do not put a baby tooth back.','Press a clean cloth on the gum to stop bleeding.','See a dentist within an hour if you can.']},
{t:'Splinter',i:'🪡',s:['Wash your hands and the skin around the splinter.','Clean tweezers with alcohol or boiling water, then pull the splinter out in the direction it went in.','Wash the area again and cover it if needed.','Do not dig at it with a needle if it is deep.','See a clinic if it is deep, stays in, or the skin turns red, swollen or has pus.']},
{t:'Bruise',i:'🟣',s:['Rest the injured part.','Hold a cold pack wrapped in cloth on it for 15 minutes, several times a day.','Raise the limb if you can.','Watch for severe pain, swelling or being unable to use the limb, which can mean a broken bone.']},
{t:'Crush injury',i:'🖐️',s:['Free the hand or foot if it is safe to do so.','Remove rings, watches or shoes quickly before swelling starts.','Apply a cold pack wrapped in cloth for 15 minutes and raise the limb.','Cover any wound with a clean dressing and press gently if it bleeds.','Get medical help if it is deformed, very swollen, numb or the person cannot move it.']},
{t:'Neck or back injury',i:'🧍',s:['Do not move the person unless they are in immediate danger, such as fire or water.','Call 112 or ask someone else to.','Tell them to stay still. Hold their head and neck gently in the position you found them.','Do not let them sit up, stand or walk.','If they stop breathing, start CPR and get help.']},
{t:'Chemical on skin',i:'🧪',s:['Wear gloves or use a cloth to protect your own skin.','Take off any clothing the chemical touched.','Rinse the skin with running water for at least 20 minutes.','Do not try to neutralise it with another chemical.','Cover loosely with a clean cloth and get medical help.']},
{t:'Fire and smoke',i:'🚒',s:['Get out immediately. Do not collect belongings.','Stay low under the smoke and keep doors closed behind you.','If clothes are on fire: stop, drop to the ground and roll.','Never use a lift. Meet at the assembly point.','Call 112 from outside. Never go back in.']},
{t:'Object in nose or ear',i:'👂',s:['Do not poke or try to dig it out with tweezers or cotton buds.','For the nose, ask the person to breathe through the mouth and gently blow out of the other nostril.','For the ear, tilt the head so the ear faces down and let it fall out.','Go to a clinic if it does not come out easily.','A button battery or magnet is an emergency. Go to hospital at once.']}
];
const TIPS=[
{c:'Accident prevention',i:'🚸',l:['Walk, do not run, on stairs and in corridors.','Wipe up spills and report broken furniture.','Keep bags and shoes out of walkways.','Do not push or play rough near stairs and doors.','Tell a teacher about anything dangerous you see.']},
{c:'Fire safety',i:'🧯',l:['Know the nearest exit and the assembly point.','Stay low under smoke and never use a lift.','Never play with matches or lighters.','If clothes catch fire: stop, drop and roll.','Switch off and unplug appliances when not in use.']},
{c:'Hygiene',i:'🧼',l:['Wash hands with soap before eating and after the toilet.','Cover coughs and sneezes with your elbow.','Keep nails short and clean.','Do not share cups, towels or razors.','Bathe daily and wear clean clothes.']},
{c:'Healthy living',i:'🥗',l:['Drink safe water through the day.','Sleep 8 to 10 hours.','Eat fruit and vegetables every day.','Be active for about an hour a day.','Tell a teacher or parent when you feel unwell.']},

  ${SCANG.map(g=>{const ch=g[1].map(t=>({t,gi:GUIDES.findIndex(x=>x.t===t)})).filter(x=>x.gi>=0);return ch.length?`<div style="font-weight:700;margin:10px 0 6px">${g[0]}</div><div style="display:flex;flex-wrap:wrap;gap:8px">${ch.map(x=>`<button class="btn ${sel===x.gi?'red':'ghost'}" onclick="S.scanSel=${x.gi};render();$('#res')&&$('#res').scrollIntoView({behavior:'smooth'})">${GUIDES[x.gi].i} ${x.t}</button>`).join('')}</div>`:''}).join('')}</div>`;
  const G=sel!=null?GUIDES[sel]:null,fl=G?(SCANF[G.t]||['The person gets worse, or you are worried']):[];
  const out=G?`<div id="res"></div><div class="dang"><b>Call ${mainNum()} now if:</b><ul style="margin:6px 0 0 18px">${fl.map(d=>`<li>${d}</li>`).join('')}</ul></div>
  <div class="card"><h3>3. What to do: ${G.t}</h3>${G.s.map((s,i)=>`<div class="step"><span>${i+1}</span><div>${s}</div></div>`).join('')}</div>
  <button class="btn red block" onclick="location.href='tel:'+mainNum()">Call ${mainNum()} now</button>
  <button class="btn ghost block" style="margin-top:8px" onclick="go('guide',${sel})">Open the full guide</button>`:'';
  return ['Check an injury',pick+what+out+`<p class="warn">This app does not analyse the photo. You choose the closest match, and the steps are first-aid guidance only. It does not replace a doctor or trained first aider.</p>`];
}
function guides(){
  return ['First aid guide',`<p class="mut" style="margin-bottom:10px">Choose a situation. In a life-threatening emergency, call 112 first.</p>`+
  GUIDES.map((g,i)=>`<button class="tile" onclick="go('guide',${i})"><i style="background:var(--bg)">${g.i}</i><div>${g.t}<small>${g.s.length} steps</small></div></button>`).join('')];
}
function guide(){
  const g=GUIDES[S.arg];

  <button class="btn red block" onclick="location.href='tel:'+mainNum()">Call ${mainNum()} now</button>
  <p class="warn">This guide supports first response only. It does not replace a doctor or trained first aider.</p>`];

/* ---- SOS ---- */
let sosTimer=null,sosCancel=false;
function userContacts(){return store.get('contacts',[])}
function sos(){
  const c=userContacts();
  return ['Emergency alert (SOS)',`<p class="mut" style="text-align:center">Tap to send your GPS location and see your contacts and the nearest hospitals.</p>
  <button class="sosbtn" onclick="startSOS()">SOS</button>
  <p class="mut" style="text-align:center">${c.length?`${c.length} contact${c.length>1?'s':''} will be alerted.`:'No contacts saved yet. Add contacts first so the alert reaches someone.'}</p>
  <button class="btn ghost block" style="margin-top:14px" onclick="go('contacts')">Manage contacts</button>`];
}
function startSOS(){
  sosCancel=false;let n=3;const ov=$('#ov');ov.className='show';
  const draw=()=>ov.innerHTML=`<div class="big">${n}</div><h2 style="margin:10px 0">Sending alert…</h2><p>Getting your location</p><button class="btn" onclick="cancelSOS()">Cancel</button>`;
  draw();
  const loc=getLoc();
  const hp=loc.then(findHospitals);
  sosTimer=setInterval(async()=>{n--;if(n>0){draw();return}clearInterval(sosTimer);if(sosCancel)return;finishSOS(await loc,hp)},1000);
}
function cancelSOS(){sosCancel=true;clearInterval(sosTimer);$('#ov').className=''}
function getLoc(){return new Promise(res=>{if(!navigator.geolocation)return res(null);navigator.geolocation.getCurrentPosition(p=>res({lat:p.coords.latitude,lng:p.coords.longitude}),()=>res(null),{enableHighAccuracy:true,timeout:8000,maximumAge:10000})})}
function kmBetween(a,b,c,d){const t=x=>x*Math.PI/180,dl=t(c-a),dn=t(d-b),h=Math.sin(dl/2)**2+Math.cos(t(a))*Math.cos(t(c))*Math.sin(dn/2)**2;return 12742*Math.asin(Math.sqrt(h))}
/* Nearby hospitals from OpenStreetMap (free, no key). Falls back to the last saved list when offline. */
async function findHospitals(loc){
  if(!loc)return null;
  const key='hosp:'+loc.lat.toFixed(1)+','+loc.lng.toFixed(1);
  try{
    const q=`[out:json][timeout:10];nwr["amenity"~"^(hospital|clinic)$"](around:20000,${loc.lat},${loc.lng});out center tags 60;`;
    const ac=new AbortController(),tm=setTimeout(()=>ac.abort(),9000);
    const r=await fetch('https://overpass-api.de/api/interpreter?data='+encodeURIComponent(q),{signal:ac.signal});clearTimeout(tm);
    if(!r.ok)throw 0;
    const j=await r.json();
    const list=j.elements.map(e=>{const t=e.tags||{},la=e.lat??(e.center&&e.center.lat),lo=e.lon??(e.center&&e.center.lon);if(la==null||lo==null)return null;
      const ph=String(t.phone||t['contact:phone']||'').split(';')[0].replace(/[^\d+]/g,'');
      return{name:t.name||(t.amenity==='hospital'?'Hospital':'Clinic'),la,lo,ph,km:kmBetween(loc.lat,loc.lng,la,lo),h:t.amenity==='hospital'}}).filter(Boolean)
      .sort((a,b)=>(a.km-(a.h?3:0))-(b.km-(b.h?3:0))).slice(0,5);
    if(list.length)store.set(key,list);
    return list;
  }catch(e){const old=store.get(key,null);return old&&old.length?old:null}
}
function finishSOS(loc,hp){
  const who=store.get('me','A student');
  const where=loc?`Location: https://maps.google.com/?q=${loc.lat},${loc.lng} (${loc.lat.toFixed(4)}, ${loc.lng.toFixed(4)})`:'Location unavailable. Please call me.';
  const msg=`EMERGENCY! ${who} needs help. ${where} Sent from FirstAid app.`;
  const cs=userContacts().map(c=>({name:c.name,ph:String(c.phone).replace(/[^\d+]/g,'')})).filter(c=>c.ph);
  const nums=cs.map(c=>c.ph);
  const log=store.get('alerts',[]);log.unshift({time:new Date().toLocaleString(),loc,sent:nums.length,status:'Sent'});store.set('alerts',log.slice(0,30));DB.saveAlert({name:who,lat:loc?loc.lat:null,lng:loc?loc.lng:null});
  const ov=$('#ov');ov.className='show res';
  ov.innerHTML=`<div style="font-size:54px;line-height:1">✓</div><h2 style="margin:6px 0">Alert ready</h2>
  <p style="margin-bottom:10px">${loc?`Your location: ${loc.lat.toFixed(4)}°, ${loc.lng.toFixed(4)}°`:'No GPS fix. Message says location unavailable.'}</p>
  <button class="btn" style="font-size:18px;padding:14px 20px" onclick="location.href='tel:'+mainNum()">📞 Call ${mainNum()}</button>
  <div class="sc"><h3>Your emergency contacts</h3>${cs.length?cs.map(c=>`<div class="row" style="padding:6px 0"><div>${esc(c.name)}<small>${esc(c.ph)}</small></div><button class="btn" style="min-width:0;margin:0" onclick="location.href='tel:${c.ph}'">Call</button></div>`).join('')
    +`<button class="btn" onclick="location.href='sms:${nums.join(',')}?body=${encodeURIComponent(msg)}'">Send location by SMS to all</button>`:'<p>No contacts saved yet. Add some under Contacts.</p>'}
  <button class="btn" onclick="window.open('https://wa.me/?text=${encodeURIComponent(msg)}')">Send by WhatsApp</button></div>
  <div class="sc"><h3>Nearest hospitals</h3><div id="sosH"><p>${loc?'Finding hospitals near you…':'Turn on location to see nearby hospitals.'}</p></div></div>
  <button class="btn" style="background:transparent;color:#fff;border:2px solid #fff" onclick="$('#ov').className=''">Close</button>`;
  if(!loc)return;
  const mapBtn=`<button class="btn" onclick="findNear('hospital')">Search hospitals in Maps</button>`;
  (hp||Promise.resolve(null)).then(list=>{const el=$('#sosH');if(!el)return;
    if(!list||!list.length){el.innerHTML='<p>Could not load the hospital list (needs internet).</p>'+mapBtn;return}
    el.innerHTML=list.map(h=>`<div class="row" style="padding:7px 0"><div>${esc(h.name)}<small>${h.km.toFixed(1)} km away</small></div>
      ${h.ph?`<button class="btn" style="min-width:0;margin:0" onclick="location.href='tel:${h.ph}'">Call</button>`:''}
      <button class="btn" style="min-width:0;margin:0" onclick="window.open('https://www.google.com/maps/dir/?api=1&destination=${h.la},${h.lo}')">Go</button></div>`).join('')+mapBtn;
  });
}

/* ---- Contacts ---- */
function contacts(){
  const c=userContacts();
  return ['Emergency contacts',`${numsCard()}
  <div class="card"><h3>Your name</h3><input id="me" placeholder="Name shown in alerts" value="${esc(store.get('me',''))}"><button class="btn block" onclick="store.set('me',$('#me').value.trim()||'A student');this.textContent='Saved'">Save name</button></div>
  <div class="card"><h3>Alert contacts</h3>${c.length?c.map((x,i)=>`<div class="row" style="padding:8px 0"><div>${esc(x.name)}<div class="mut">${esc(x.phone)}</div></div><button class="btn" onclick="location.href='tel:${esc(x.phone)}'">Call</button><button class="btn ghost" onclick="delC(${i})">✕</button></div>`).join(''):'<p class="mut">None yet. Add parents, a teacher and the school admin.</p>'}
  <input id="cn" placeholder="Name (e.g. Mum, School admin)"><input id="cp" type="tel" placeholder="Phone number"><button class="btn block" onclick="addC()">Add contact</button></div>`];
}
function addC(){const n=$('#cn').value.trim(),p=$('#cp').value.trim();if(!n||p.replace(/\D/g,'').length<7){alert('Enter a name and a valid phone number.');return}const c=userContacts();c.push({name:n,phone:p});store.set('contacts',c);render()}
function delC(i){const c=userContacts();c.splice(i,1);store.set('contacts',c);render()}

/* ---- More / tips / quiz / health ---- */
function more(){
  const pf=store.get('profile',{});const m=[...(pf.role==='Admin'?[['admin','🛡️','Admin dashboard']]:[]),['scan','📷','Check an injury'],['tips','⚠️','Safety tips'],['quiz','🎓','Life skills quiz'],['health','📍','Nearby health centres'],['alerts','🕒','Alert history']];
  return ['More',`<div>${m.map(x=>`<button class="tile" onclick="go('${x[0]}')"><i style="background:var(--bg)">${x[1]}</i><div>${x[2]}</div></button>`).join('')}</div><button class="btn ghost block" style="margin-top:6px" onclick="logout()">Sign out (${esc(pf.name||'')})</button>`];
}
function tips(){return ['Safety tips',TIPS.map(t=>`<div class="card"><h3>${t.i} ${t.c}</h3><ul style="padding-left:20px">${t.l.map(x=>`<li>${x}</li>`).join('')}</ul></div>`).join('')]}
function quiz(){
  const q=S.q,L=q.list||(q.list=daily(S.round||0)),no=(S.round||0)+1;
  if(q.done){const p=Math.round(q.sc/L.length*100);return ['Daily life skills quiz',`<div class="card" style="text-align:center;padding:24px 16px"><p class="mut">Quiz ${no} complete</p><div style="font-size:56px;font-weight:800;color:var(--head);line-height:1.1">${q.sc}<span style="font-size:26px;color:var(--mut)"> / ${L.length}</span></div><p style="margin:6px 0 2px"><b>You scored ${q.sc} out of ${L.length} (${p}%)</b></p><p class="mut">${p>=80?'Excellent. You can handle everyday challenges.':p>=50?'Good effort. Review the explanations and try again.':'Keep learning. Read the guides and try again.'}</p></div>
  <p style="text-align:center;margin:14px 0 10px"><b>Would you like to take another quiz?</b></p>
  <button class="btn block" style="margin-bottom:10px" onclick="another()">Yes, take another quiz</button>
  <button class="btn ghost block" onclick="go('home')">No, back to home</button>`]}
  const [t,o,a,w]=L[q.i],bs=store.get('qlog',{})[dayKey()];
  return ['Daily life skills quiz',`<p class="mut">Quiz ${no} · Question ${q.i+1} of ${L.length}${bs!=null?' · Best today: '+bs:''}</p><div class="bar"><i style="width:${q.i/L.length*100}%"></i></div><h3 style="margin-bottom:12px">${t}</h3>
  ${o.map((x,i)=>`<button class="opt ${q.pick!=null?(i===a?'ok':i===q.pick?'bad':''):''}" ${q.pick!=null?'disabled':''} onclick="pickA(${i})">${x}</button>`).join('')}
  ${q.pick!=null?`<div class="card"><b>${q.pick===a?'Correct.':'Not quite.'}</b> ${w}</div><button class="btn block" onclick="nextQ()">${q.i===L.length-1?'See my score':'Next question'}</button>`:''}`];
}
function another(){S.round=(S.round||0)+1;S.q={i:0,sc:0,done:false,pick:null,list:daily(S.round)};render();$('#app').scrollTop=0}
function pickA(i){const q=S.q;q.pick=i;if(i===q.list[q.i][2])q.sc++;render()}
function nextQ(){const q=S.q;q.pick=null;q.i++;if(q.i>=q.list.length){q.done=true;const l=store.get('qlog',{}),k=dayKey();l[k]=Math.max(l[k]||0,q.sc);store.set('qlog',l)}render();$('#app').scrollTop=0}
function findNear(q){
  const w=window.open('about:blank','_blank');
  getLoc().then(l=>{
    const u=l?`https://www.google.com/maps/search/${q}/@${l.lat},${l.lng},14z`:`https://www.google.com/maps/search/${q}+near+me`;
    if(w)w.location=u;else location.href=u;
  });
}
function health(){
  return ['Nearby health centres',`<p class="mut" style="margin-bottom:12px">Uses your location to search in your maps app. Needs internet.</p>
  ${[['Hospitals','hospital'],['Clinics','clinic'],['Pharmacies','pharmacy']].map(x=>`<button class="btn block" style="margin-bottom:8px" onclick="findNear('${x[1]}')">Find ${x[0].toLowerCase()} near me</button>`).join('')}`];
}
function alerts(){
  const l=store.get('alerts',[]);
  return ['Alert history',l.length?l.map(a=>`<div class="card"><b>${a.time}</b><div class="mut">${a.loc?`${a.loc.lat.toFixed(4)}, ${a.loc.lng.toFixed(4)}`:'No GPS fix'} · ${a.sent} contact${a.sent===1?'':'s'}</div></div>`).join(''):'<p class="mut">No alerts sent yet.</p>'];
}
function numsCard(){
  const adm=store.get('profile',{}).role==='Admin',n=(adm&&S.nums)||getNums();
  if(!adm)return `<div class="card"><h3>Emergency numbers</h3>${n.map(d=>`<div class="row" style="padding:8px 0"><div>${esc(d[0])}<div class="mut">${esc(d[1])}</div></div><button class="btn" onclick="location.href='tel:${esc(d[1])}'">Call</button></div>`).join('')}<p class="mut">Check these match your area’s official numbers.</p></div>`;
  return `<div class="card"><h3>Emergency numbers (you can edit)</h3><p class="mut" style="margin-bottom:8px">The first number is used for the top phone icon and the Call buttons.</p>${n.map((d,i)=>`<div class="row" style="margin-bottom:6px"><input class="nn" value="${esc(d[0])}" placeholder="Service name" style="margin:0"><input class="np" value="${esc(d[1])}" placeholder="Number" type="tel" style="margin:0;max-width:130px"><button class="btn ghost" onclick="delN(${i})" aria-label="Remove">✕</button></div>`).join('')}<div class="row" style="margin-top:8px"><button class="btn ghost" onclick="addN()">+ Add number</button><button class="btn" onclick="saveN()">Save changes</button></div></div>`;
}
function readN(keep){const a=[...document.querySelectorAll('.nn')],b=[...document.querySelectorAll('.np')],l=a.map((x,i)=>[x.value.trim(),b[i].value.trim()]);return keep?l:l.filter(r=>r[0]&&r[1])}
function addN(){S.nums=[...readN(true),['','']];render()}
function delN(i){const l=readN(true);l.splice(i,1);S.nums=l;render()}
function saveN(){
  const l=readN();
  if(!l.length)return alert('Keep at least one emergency number.');
  if(l.some(r=>!/^[+\d][\d\s()+-]{2,}$/.test(r[1])))return alert('Numbers can only contain digits, spaces, + ( ) and -.');
  store.set('numbers',l);S.nums=null;DB.saveNums(l);render();alert('Emergency numbers saved.');
}

function login(){
  const reg=S.reg||!useFB;
  return ['Welcome',`<div class="card"><h3>${S.reg?'Create account':(useFB?'Sign in':'Get started')}</h3>
  ${reg?'<input id="ln" placeholder="Your name">':''}
  ${useFB?'<input id="le" type="email" placeholder="Email"><input id="lp" type="password" placeholder="Password (6+ characters)">':''}
  ${reg?`<select id="lr" onchange="$('#apw').style.display=this.value==='Admin'?'block':'none'" style="width:100%;padding:12px;border-radius:14px;border:1.5px solid var(--line);margin-bottom:8px;font-size:16px;background:var(--card);color:var(--ink)"><option>Student</option><option>Teacher</option>${!useFB?'<option>Admin</option>':''}</select>${!useFB?'<input id="apw" type="password" placeholder="Admin password" style="display:none">':''}`:''}
  <button class="btn block" onclick="doLogin()">${S.reg?'Create account':(useFB?'Sign in':'Continue')}</button>
  ${useFB?`<button class="btn ghost block" style="margin-top:8px" onclick="S.reg=!S.reg;render()">${S.reg?'I already have an account':'Create a new account'}</button>`:'<p class="mut" style="margin-top:10px">Demo mode: nothing is stored online. Paste your Firebase keys into the file to turn on real accounts and a live admin screen.</p>'}
  <p id="lerr" style="color:#c81428;margin-top:8px"></p></div>`];
}
function setProfile(p){store.set('profile',p);store.set('me',p.name);go('home')}
function logout(){if(useFB&&fbAuth)fbAuth.signOut();store.set('profile',null);S.reg=false;go('login')}
async function doLogin(){
  const g=id=>(($('#'+id)||{}).value||''),err=m=>{$('#lerr').textContent=m};
  try{
    if(!useFB){const n=g('ln').trim();if(!n)return err('Enter your name.');const role=g('lr')||'Student';if(role==='Admin'&&hashPw(g('apw'))!==ADMIN_HASH)return err('Wrong admin password.');return setProfile({name:n,role})}
    const e=g('le').trim(),pw=g('lp');if(!e||pw.length<6)return err('Enter your email and a password of 6+ characters.');
    if(S.reg){const n=g('ln').trim();if(!n)return err('Enter your name.');const role=g('lr')||'Student';
      const r=await fbAuth.createUserWithEmailAndPassword(e,pw);
      await fbDb.collection('Users').doc(r.user.uid).set({name:n,email:e,role,emergencyContacts:[]});return setProfile({name:n,role,email:e})}
    const r=await fbAuth.signInWithEmailAndPassword(e,pw),d=await fbDb.collection('Users').doc(r.user.uid).get(),u=d.data()||{};
    setProfile({name:u.name||e,role:u.role||'Student',email:e});
  }catch(x){err(x.message)}
}
function admin(){
  const p=store.get('profile',{});
  if(p.role!=='Admin')return ['Admin dashboard','<div class="card"><p>Only admin accounts can open this screen.</p></div>'];
  if(S.err)return ['Admin dashboard',`<div class="card"><p>Could not load alerts: ${esc(S.err)}</p></div>`];
  const A=S.alerts;if(!A)return ['Admin dashboard','<p class="mut">Loading alerts…</p>'];
  const c=s=>A.filter(a=>a.status===s).length;
  const stat=(n,l)=>`<div class="card" style="flex:1;text-align:center;margin:0"><div style="font-size:26px;font-weight:800;color:var(--head)">${n}</div><div class="mut">${l}</div></div>`;
  return ['Admin dashboard',`<p class="mut" style="margin-bottom:8px">${useFB?'Live from Firebase.':'Demo mode: showing alerts from this device only.'}</p>
  <div class="row" style="margin-bottom:12px">${stat(c('New'),'New')}${stat(c('Responding'),'Responding')}${stat(c('Resolved'),'Resolved')}</div>`+
  (A.length?A.map(a=>`<div class="card"><div class="row"><div><b>${esc(a.name||'Unknown')}</b><div class="mut">${new Date(a.time).toLocaleString()}</div></div><span class="pill ${a.status}">${a.status}</span></div>
  <div style="margin:8px 0">${a.lat!=null?`<a href="https://maps.google.com/?q=${a.lat},${a.lng}" target="_blank" rel="noopener" style="color:var(--head);font-weight:600">View location on map</a>`:'<span class="mut">No GPS location</span>'}</div>
  <div class="row">${['Responding','Resolved'].map(s=>`<button class="btn ${a.status===s?'':'ghost'}" onclick="setSt('${a.id}','${s}')">${s}</button>`).join('')}</div></div>`).join(''):'<div class="card"><p class="mut">No alerts yet.</p></div>')];
}
function setSt(id,s){DB.setStatus(id,s).then(()=>{if(!useFB){S.alerts=store.get('allAlerts',[]);S.lastJ='';render()}}).catch(e=>alert(e.message))}

/* live mode: re-check who is signed in and their real role from the server on every start */
if(useFB)fbAuth.onAuthStateChanged(async u=>{
  if(!u){if(store.get('profile',null)){store.set('profile',null)}render();return}
  try{const x=(await fbDb.collection('Users').doc(u.uid).get()).data();
    const sn=(await fbDb.collection('Settings').doc('numbers').get()).data();if(sn&&sn.list){store.set('numbers',sn.list.map(o=>[o.name,o.phone]));render()}
    if(x){const pr=store.get('profile',null),np={name:x.name||u.email,role:x.role||'Student',email:u.email};
      if(!pr||pr.role!==np.role||pr.name!==np.name){store.set('profile',np);store.set('me',np.name);render()}}}catch(e){}
});
render();
if('serviceWorker' in navigator&&location.protocol!=='file:')addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
